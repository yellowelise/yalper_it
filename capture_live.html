<script>
// Variabili per il player (usa SERVER da live_stream.js)
let currentPlaylist = [];
let currentPlaylistIndex = 0;
let hlsPlayer = null;

// Funzione per caricare i video live
function load_live_btn(div = '6', day = null) {
    const OTT = localStorage.getItem('OTT');
    const token = localStorage.getItem('token');

    let url = SERVER + 'reload_live_btn.php?OTT=' + encodeURIComponent(OTT) + '&token=' + encodeURIComponent(token) + '&div=' + div;
    if (day) {
        url += '&day=' + day;
    }

    fetch(url)
        .then(response => response.text())
        .then(html => {
            document.getElementById('live_btn').innerHTML = html;
        })
        .catch(error => {
            console.error('Errore caricamento video live:', error);
            document.getElementById('live_btn').innerHTML = '<div class="alert alert-danger" style="margin:20px;">Errore nel caricamento dei video</div>';
        });
}

// Mostra il container dei video live
function showLiveVideos() {
    document.getElementById('live_videos_container').style.display = 'block';
    load_live_btn();
}

// Nasconde il container dei video live
function hideLiveVideos() {
    document.getElementById('live_videos_container').style.display = 'none';
}

// Visualizza un singolo segmento live
function visualizza_live(element, base64File) {
    const file = atob(base64File);
    const url = SERVER + file;

    playHLSVideo(url);
}

// Riproduce tutti i segmenti in sequenza
function playAllSegments(base64Files) {
    currentPlaylist = base64Files.map(b64 => SERVER + atob(b64));
    currentPlaylistIndex = 0;

    if (currentPlaylist.length > 0) {
        playHLSVideo(currentPlaylist[0]);
        updateNextButton();
    }
}

// Funzione per riprodurre video HLS
function playHLSVideo(url) {
    const container = document.getElementById('live_player_container');
    const video = document.getElementById('live_player_video');

    container.style.display = 'block';

    // Cleanup del player HLS precedente
    if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
    }

    if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });

        // Quando il video termina, passa al prossimo
        video.onended = function() {
            if (currentPlaylist.length > 0 && currentPlaylistIndex < currentPlaylist.length - 1) {
                playNextSegment();
            }
        };
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari native HLS support
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
        video.onended = function() {
            if (currentPlaylist.length > 0 && currentPlaylistIndex < currentPlaylist.length - 1) {
                playNextSegment();
            }
        };
    }
}

// Passa al prossimo segmento
function playNextSegment() {
    if (currentPlaylist.length > 0 && currentPlaylistIndex < currentPlaylist.length - 1) {
        currentPlaylistIndex++;
        playHLSVideo(currentPlaylist[currentPlaylistIndex]);
        updateNextButton();
    }
}

// Aggiorna il testo del pulsante next
function updateNextButton() {
    const btn = document.getElementById('btn_next_segment');
    if (currentPlaylist.length > 0) {
        const remaining = currentPlaylist.length - currentPlaylistIndex - 1;
        if (remaining > 0) {
            btn.textContent = '▶ Prossimo (' + remaining + ' rimasti)';
            btn.style.display = 'inline-block';
        } else {
            btn.textContent = 'Fine sessione';
            btn.style.background = '#6c757d';
        }
    }
}

// Chiude il player
function closeLivePlayer() {
    const container = document.getElementById('live_player_container');
    const video = document.getElementById('live_player_video');

    if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
    }

    video.pause();
    video.src = '';
    container.style.display = 'none';

    // Reset playlist
    currentPlaylist = [];
    currentPlaylistIndex = 0;

    // Reset next button
    const btn = document.getElementById('btn_next_segment');
    btn.textContent = '▶ Prossimo';
    btn.style.background = '#28a745';
}

// ============ FUNZIONI CONDIVISIONE ============

function showToast(message, isError) {
    var toast = document.getElementById('share-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'share-toast';
        toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:25px;color:#fff;font-size:14px;z-index:10001;opacity:0;transition:opacity 0.3s;';
        document.body.appendChild(toast);
    }
    toast.style.background = isError ? '#dc3545' : '#28a745';
    toast.textContent = message;
    toast.style.opacity = '1';
    setTimeout(function() { toast.style.opacity = '0'; }, 2500);
}

function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            showToast('Link copiato negli appunti!');
        }).catch(function() {
            fallbackCopyToClipboard(text);
        });
    } else {
        fallbackCopyToClipboard(text);
    }
}

function fallbackCopyToClipboard(text) {
    var textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try {
        document.execCommand('copy');
        showToast('Link copiato negli appunti!');
    } catch (e) {
        showToast('Impossibile copiare il link', true);
    }
    document.body.removeChild(textArea);
}

    // Facebook
    socialGrid.innerHTML += '<button onclick="shareFacebook(\'' + encodeURIComponent(url) + '\')" style="background:#1877F2;border:none;border-radius:16px;padding:20px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform 0.2s;"><svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg><span style="color:#fff;font-size:13px;font-weight:500;">Facebook</span></button>';

    // X (Twitter)
    socialGrid.innerHTML += '<button onclick="shareTwitter(\'' + encodeURIComponent(url) + '\', \'' + encodeURIComponent(shareText) + '\')" style="background:#000;border:none;border-radius:16px;padding:20px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform 0.2s;"><svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span style="color:#fff;font-size:13px;font-weight:500;">X</span></button>';

    content.appendChild(socialGrid);

    // Seconda riga: Email e Copia Link
    var secondRow = document.createElement('div');
    secondRow.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px;';

    // Email
    secondRow.innerHTML += '<button onclick="shareEmail(\'' + encodeURIComponent(url) + '\', \'' + encodeURIComponent(title) + '\')" style="background:#EA4335;border:none;border-radius:14px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.2s;"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg><span style="color:#fff;font-size:15px;font-weight:500;">Email</span></button>';

    // Copia Link
    secondRow.innerHTML += '<button onclick="copyToClipboard(\'' + url + '\')" style="background:#6c757d;border:none;border-radius:14px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.2s;"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg><span style="color:#fff;font-size:15px;font-weight:500;">Copia Link</span></button>';

    content.appendChild(secondRow);

    // Native Share (se supportato)
    if (navigator.share) {
        var nativeBtn = document.createElement('button');
        nativeBtn.onclick = function() { shareNative(url, title); };
        nativeBtn.style.cssText = 'width:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;border-radius:14px;padding:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;transition:transform 0.2s;';
        nativeBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>' +
            '<span style="color:#fff;font-size:16px;font-weight:500;">Altre opzioni...</span>';
        content.appendChild(nativeBtn);
    }

    // Link preview
    var linkPreview = document.createElement('div');
    linkPreview.style.cssText = 'background:#f5f5f5;border-radius:10px;padding:14px;font-size:13px;color:#666;word-break:break-all;text-align:left;';
    linkPreview.textContent = url;
    content.appendChild(linkPreview);

    modal.appendChild(content);
    document.body.appendChild(modal);
}

function closeShareModal() {
    var modal = document.getElementById('share-modal');
    if (modal) modal.remove();
}

function shareWhatsApp(url, text) {
    window.open('https://wa.me/?text=' + text + '%20' + url, '_blank');
    closeShareModal();
}

function shareTelegram(url, text) {
    window.open('https://t.me/share/url?url=' + url + '&text=' + text, '_blank');
    closeShareModal();
}

function shareFacebook(url) {
    window.open('https://www.facebook.com/sharer/sharer.php?u=' + url, '_blank', 'width=600,height=400');
    closeShareModal();
}

function shareTwitter(url, text) {
    window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + url, '_blank', 'width=600,height=400');
    closeShareModal();
}

function shareEmail(url, title) {
    var subject = encodeURIComponent('Guarda questa sessione live su YalpeR');
    var body = encodeURIComponent('Ciao!\n\nGuarda questa sessione live registrata con YalpeR:\n' + decodeURIComponent(title) + '\n\n' + decodeURIComponent(url) + '\n\nBuona visione!');
    window.location.href = 'mailto:?subject=' + subject + '&body=' + body;
    closeShareModal();
}

function shareNative(url, title) {
    if (navigator.share) {
        navigator.share({
            title: 'YalpeR - ' + title,
            text: 'Guarda questa sessione live su YalpeR: ' + title,
            url: url
        }).then(function() {
            closeShareModal();
        }).catch(function(err) {
            console.log('Share cancelled or failed:', err);
        });
    }
}
</script>
