<script>
document.addEventListener('DOMContentLoaded', function() {
	const SERVER = "https://yalper.it/";
    
    // Creiamo un oggetto con i dati del form
    const formData = {
        OTT: localStorage.getItem("OTT")
    };
    
    fetch(SERVER + 'API/logout.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
			//alert(data.OTT);
			localStorage.setItem('OTT', data.OTT);
            window.location.href = data.redirect;
        } else {
            document.getElementById('errorMessages').innerHTML = '<div class="alert alert-danger">${data.message}</div>';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('errorMessages').innerHTML = '<div class="alert alert-danger">Errore di connessione al server</div>';
    });
});

    

</script>
