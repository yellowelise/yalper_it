.liveStream {
    position: fixed; 
    right: 0; 
    bottom: 0;
    min-width: 100%; 
    min-height: 100%;
    width: auto; 
    height: auto;
    z-index: -100;
    background-size: cover;
    background-repeat: no-repeat;
    overflow: hidden;
}				
    .vertical-scrollable {
            position: absolute;
            top: 40px;
            bottom: 40px;
            left: 10px;
            width: 45%;
            overflow-y: scroll;
        }				
    .a_destra {
            position: absolute;
            top: 40px;
            bottom: 40px;
            right: 10px;
            width: 45%;
        }	

header {
    position: relative;
    height: 100vh;
    z-index: 0;
}

header #video {
    -webkit-transform: translateX(-50%) translateY(-50%);
    -moz-transform: translateX(-50%) translateY(-50%);
    -ms-transform: translateX(-50%) translateY(-50%);
    -o-transform: translateX(-50%) translateY(-50%);
    transform: translateX(-50%) translateY(-50%);
    position: absolute;
   top: 50%;
   left: 50%;
   # top: 0;
   # left: 0;

    min-height: 100%;
    width: auto;
    height: auto;

}      

video {

#  object-fit: fill;
}  			


.messaggio {
 position: absolute;
 top: 50%;
 left: 50%;

 z-index:1;

 width:200px;

.reaction-container {
    position:relative;

    padding: 3px;
    display: flex;
    width:90%;
    align-items: center;
    bottom:0px;
    gap: 0px;
    background: #f5f5f5;
    z-index:10000;
}

.view-count {
    color: #666;
    font-size: 14px;
}

.reaction-buttons {
    display: flex;
    gap: 5px;

.reaction-btn {

    align-items: center;
    gap: 2px;

<script>
let orient = localStorage.getItem("orientation") || 'landscape';


let txt_home = sessionStorage.getItem("txt_home") || 'CASA';
let home_goal = sessionStorage.getItem("home_goal") || '0';
let txt_away = sessionStorage.getItem("txt_away") || 'OSPITI';
let away_goal = sessionStorage.getItem("away_goal") || '0';
let curr_minutes = sessionStorage.getItem("curr_minutes") || '1';
let indicatore_tempo = sessionStorage.getItem("indicatore_tempo") || 'PT';


$("#txt_home").val(txt_home);
$(".home_tags").val(txt_home);

$("#home_goal").val(home_goal);

$("#txt_away").val(txt_away);
$(".away_tags").val(txt_away);
$("#away_goal").val(away_goal);

$("#minutes").val(curr_minutes);
$("#indicatore_tempo").val(indicatore_tempo);

function isScreenOrientationSupported() {
    try {
        return (typeof screen !== 'undefined' && 
                screen.orientation &&
                typeof screen.orientation.type === 'string');
    } catch(e) {
        return false;
    }
}



function change_orientation()
{
    if (orient == 'landscape')
        orient = 'portrait';
    else
        orient = 'landscape';

//	console.log("orient: " + orient);

    localStorage.setItem("orientation",orient);
    screen.orientation.lock(orient);
/*	$("#padre_di_tutto").hide();
    $("#ruota").show();

    alert("ori: " + orient + " real: " + screen.orientation.type);

  if (screen.orientation.type == orient + '-primary')

function soloAlfanumericoConSpazi(event) {
  const char = String.fromCharCode(event.which || event.keyCode);
  const pattern = /^[a-zA-Z0-9\s]+$/;
  if (!pattern.test(char)) {
    event.preventDefault();
    return false;
  }
  return true;
}

function soloNumerico(event) {
  const char = String.fromCharCode(event.which || event.keyCode);
  const pattern = /^[0-9]+$/;
  if (!pattern.test(char)) {
    event.preventDefault();
    return false;
  }
  return true;
}
